<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Diff Checker</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Text Diff Checker</h1>
        <div class="text-container">
            <label>Original Text:</label>
            <textarea id="originalText"></textarea>
        </div>
        <div class="text-container">
            <label>Modified Text:</label>
            <textarea id="modifiedText"></textarea>
        </div>
        <button type="button" id="diffButton">Show Diff</button>
        <div class="warning" id="warningMessage" aria-live="polite"></div>
        <div class="diff" id="diffOutput">===================================================================<br />
            <br />Diff Placeholder <br /> <br />
        </div>
    </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
